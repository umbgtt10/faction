[package]
name = "faction-system-tests"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Multi-process convergence, transport, timer, and observer system tests for faction."
repository = "https://github.com/umbgtt10/faction"
homepage = "https://github.com/umbgtt10/faction"
documentation = "https://docs.rs/faction"
readme = "../README.md"
keywords = ["cluster", "readiness", "testing", "distributed", "convergence"]
categories = ["development-tools::testing", "network-programming"]
autotests = false
publish = false

[dependencies]
chrono.workspace = true
faction.workspace = true
faction-protocol.workspace = true
prost.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tonic-build.workspace = true

[build-dependencies]
tonic-build.workspace = true

[dev-dependencies]
rstest.workspace = true

[[bin]]
name = "faction-node"
path = "src/bin/faction-node.rs"

[[test]]
name = "all_tests"
path = "tests/all_tests.rs"
