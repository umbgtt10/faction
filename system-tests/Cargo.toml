[package]
name = "faction-system-tests"
version = "0.1.0"
edition = "2024"
autotests = false
repository = "https://github.com/umbgtt10/faction"
homepage = "https://github.com/umbgtt10/faction"

[dependencies]
chrono = "0.4"
faction = { path = "../core" }
faction-protocol = { path = "../protocol" }
prost = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
tokio-stream = "0.1"
tonic = "0.12"
tonic-build = "0.12"

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
rstest = { workspace = true }

[[bin]]
name = "faction-node"
path = "src/bin/faction-node.rs"

[[test]]
name = "all_tests"
path = "tests/all_tests.rs"
