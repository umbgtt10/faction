[package]
name = "faction-core-validation"
version = "0.3.2"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Deterministic scenario harness for testing the faction core state machine."
repository = "https://github.com/umbgtt10/faction"
homepage = "https://github.com/umbgtt10/faction"
documentation = "https://docs.rs/faction"
readme = "../README.md"
keywords = ["cluster", "readiness", "validation", "no-std", "testing"]
categories = ["no-std", "development-tools::testing"]
autotests = false
publish = false

[dependencies]
faction = { path = "../core" }

[dev-dependencies]
proptest.workspace = true
rstest.workspace = true

[lib]
name = "faction_core_validation"
path = "src/lib.rs"

[[test]]
name = "all_tests"
path = "tests/all_tests.rs"
