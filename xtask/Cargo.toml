[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Gate orchestration for the faction workspace"
publish = false

autotests = false

[lib]
name = "xtask"
path = "src/lib.rs"

[[bin]]
name = "xtask"
path = "src/main.rs"

[[test]]
name = "all_tests"
path = "tests/all_tests.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true, features = ["std"] }
