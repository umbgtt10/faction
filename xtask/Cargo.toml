[package]
name = "xtask"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Gate orchestration for the faction workspace, on the gates serge4rust holds and faction's own"
publish = false

autotests = false

[lib]
name = "xtask"
path = "src/lib.rs"

[[bin]]
name = "xtask"
path = "src/main.rs"

[[test]]
name = "all_tests"
path = "tests/all_tests.rs"

[dependencies]
serge4rust = { workspace = true }
