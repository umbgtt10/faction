[workspace]
members = [
    "crates/core",
    "crates/protocol",
    "crates/spec-model",
    "validation/chaos",
    "validation/core-validation",
    "validation/ladder",
    "validation/memory",
    "validation/protocol-validation",
    "validation/system-tests",
    "xtask",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"

# What validates a change, for cargo-ripe4rust (`just ripe`): the commands it
# runs, in this order, to judge an upgrade ripe rather than asked about.
[workspace.metadata.ripe4rust]
gates = ["just stage1", "just stage2"]

[workspace.dependencies]
boon = "0.6"
faction = { path = "crates/core" }
faction-core-validation = { path = "validation/core-validation" }
faction-protocol = { path = "crates/protocol" }
faction-system-tests = { path = "validation/system-tests" }
faction-spec-model = { path = "crates/spec-model" }
proptest = "1"
prost = "0.13"
rstest = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
# The gates, taken by xtask from serge4rust, the house's quality gates as a
# library, from crates.io.
serge4rust = "0.3"
sha2 = "0.11.2"
spin = "0.12.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
tokio-stream = "0.1"
tonic = "0.12"
tonic-build = "0.12"
