[workspace]
members = [
    "crates/core",
    "crates/protocol",
    "crates/spec-model",
    "validation/core-validation",
    "validation/ladder",
    "validation/protocol-validation",
    "validation/system-tests",
    "xtask",
]
resolver = "2"

[workspace.dependencies]
boon = "0.6"
chrono = "0.4"
faction = { path = "crates/core" }
faction-core-validation = { path = "validation/core-validation" }
faction-protocol = { path = "crates/protocol" }
faction-spec-model = { path = "crates/spec-model" }
proptest = "1"
prost = "0.13"
rstest = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
spin = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
tokio-stream = "0.1"
tonic = "0.12"
tonic-build = "0.12"
