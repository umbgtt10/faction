[package]
name = "faction-protocol-validation"
version = "0.3.2"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Deterministic scenario harness for testing the faction protocol layer."
repository = "https://github.com/umbgtt10/faction"
homepage = "https://github.com/umbgtt10/faction"
documentation = "https://docs.rs/faction"
readme = "../README.md"
keywords = ["cluster", "readiness", "protocol", "validation", "testing"]
categories = ["development-tools::testing"]
autotests = false
publish = false

[dependencies]
faction.workspace = true
faction-protocol.workspace = true
spin.workspace = true

[lib]
name = "faction_protocol_validation"
path = "src/lib.rs"

[[test]]
name = "all_tests"
path = "tests/all_tests.rs"
