[package]
name = "faction"
version = "0.2.0"
edition = "2021"
rust-version = "1.81"
license = "Apache-2.0"
description = "A no_std + alloc, protocol-independent cluster readiness state machine for startup coordination and readiness quorum tracking."
repository = "https://github.com/umbgtt10/etheram-ibft"
homepage = "https://github.com/umbgtt10/etheram-ibft"
documentation = "https://docs.rs/cluster-readiness"
readme = "../README.md"
keywords = ["cluster", "readiness", "distributed", "consensus", "no-std"]
categories = ["no-std", "algorithms", "network-programming"]
publish = false
autotests = false

[features]
default = []
alloc = []

[dependencies]

[dev-dependencies]
proptest.workspace = true
rstest.workspace = true

[lib]
name = "faction"
path = "src/lib.rs"

[[test]]
name = "all_tests"
path = "tests/all_tests.rs"
