# What the duplication gate scans: the library's source -- the two published
# crates and the specification's model -- as beggar's scans its library's. Tests, generated code, the build tree, the
# validation crates, the system tests and the gates' own crate are left out.
exclude = ["/tests/", "target/", "generated", "core-validation/", "protocol-validation/", "system-tests/", "xtask/"]
exclude_tests = true
