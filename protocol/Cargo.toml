[package]
name = "faction-protocol"
version = "0.3.2"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Message translator and protocol runtime for the faction cluster readiness state machine."
repository = "https://github.com/umbgtt10/faction"
homepage = "https://github.com/umbgtt10/faction"
documentation = "https://docs.rs/faction"
readme = "../README.md"
keywords = ["cluster", "readiness", "protocol", "distributed", "no-std"]
categories = ["no-std", "network-programming"]
autotests = false
publish = false

[dependencies]
faction.workspace = true

[[test]]
name = "all_tests"
path = "tests/all_tests.rs"
