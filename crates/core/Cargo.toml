[package]
name = "faction"
version = "0.8.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "A no_std + alloc, protocol-independent cluster membership state machine: whether the cluster is ready before consensus starts, then joins, additions, removals and its members' liveness."
repository = "https://github.com/umbgtt10/faction"
homepage = "https://github.com/umbgtt10/faction"
documentation = "https://docs.rs/faction"
readme = "../../README.md"
keywords = ["cluster", "membership", "distributed", "consensus", "no-std"]
categories = ["no-std", "algorithms", "network-programming"]

autotests = false

[features]
default = []
alloc = []

[dependencies]

[dev-dependencies]
proptest.workspace = true
rstest.workspace = true

[lib]
name = "faction"
path = "src/lib.rs"

[[test]]
name = "all_tests"
path = "tests/all_tests.rs"
