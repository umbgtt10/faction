[package]
name = "faction-spec-model"
version = "0.1.0"
edition.workspace = true
rust-version = "1.85"
license.workspace = true
description = "An independent model of faction's specification: its decision table read and interpreted, in the specification's own encoding."
publish = false
autotests = false

[dependencies]
serde_json.workspace = true

[lib]
name = "faction_spec_model"
path = "src/lib.rs"

[[test]]
name = "all_tests"
path = "tests/all_tests.rs"
